<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D9A2"/>
      <stop offset="1" stop-color="#0B8F62"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1E24"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#04281B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#shine)"/>

  <!-- The "deck": two server cards behind the terminal -->
  <rect x="268" y="214" width="488" height="120" rx="40" fill="#0B0D10" opacity="0.28"/>
  <rect x="228" y="268" width="568" height="136" rx="46" fill="#0B0D10" opacity="0.45"/>

  <!-- Front card: terminal -->
  <g filter="url(#shadow)">
    <rect x="188" y="330" width="648" height="480" rx="64" fill="url(#card)"/>
  </g>
  <rect x="188" y="330" width="648" height="480" rx="64" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <!-- Window dots -->
  <circle cx="262" cy="398" r="16" fill="#F04949"/>
  <circle cx="314" cy="398" r="16" fill="#F5A524"/>
  <circle cx="366" cy="398" r="16" fill="#21C08B"/>
  <!-- Prompt >_ -->
  <path d="M300 520 L400 600 L300 680" fill="none" stroke="#21C08B" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="452" y="650" width="196" height="44" rx="22" fill="#E6E9EF"/>
</svg>
